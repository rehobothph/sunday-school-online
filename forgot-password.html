<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Sunday School Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <i class="fa-solid fa-key auth-icon-large"></i>
        <h2>Forgot Password?</h2>
        <p class="auth-subtitle">ನಿಮ್ಮ ನೋಂದಾಯಿತ ಇಮೇಲ್/ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ನಮೂದಿಸಿ.</p>

        <form onsubmit="sendForgotToWhatsApp(event)">
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="text" id="resetInput" placeholder="ಇಮೇಲ್ ಅಥವಾ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ" required>
            </div>

            <button type="submit" class="btn btn-warning btn-full"><i class="fa-brands fa-whatsapp"></i> Request Reset via WhatsApp</button>
        </form>

        <div class="auth-footer">
            <p><a href="login.html">← Login ಪೇಜ್‌ಗೆ ಹಿಂತಿರುಗಿ</a></p>
        </div>
    </div>

    <script>
        function sendForgotToWhatsApp(e) {
            e.preventDefault();
            var input = document.getElementById('resetInput').value;
            var myNumber = "918073407706";

            var msg = "⚠️ *Password Reset Request*%0A%0A" +
                      "User is requesting password reset for: " + input;

            window.open("https://wa.me/" + myNumber + "?text=" + msg, "_blank");
        }
    </script>
</body>
</html>
